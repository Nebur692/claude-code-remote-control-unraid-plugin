name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        id: build
        run: |
          make package
          PACKAGE=$(ls build/*.txz)
          SHA256=$(sha256sum "$PACKAGE" | cut -d' ' -f1)
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE"
          echo "SHA256: $SHA256"

      - name: Update SHA256 in plugin file
        run: |
          SHA256="${{ steps.build.outputs.sha256 }}"
          sed -i "s/ENTITY sha256.*/ENTITY sha256    \"${SHA256}\">/" claude-code.plg
          cat claude-code.plg | head -20

      - name: Commit updated plugin file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          git checkout -B "release-${BRANCH}" "${GITHUB_SHA}"
          git add claude-code.plg
          git commit -m "Update SHA256 for ${BRANCH}" || echo "No changes to commit"
          git push origin "release-${BRANCH}:main" --force-with-lease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.package }}
          generate_release_notes: true
