name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        id: build
        run: |
          make package
          PACKAGE=$(ls build/*.txz)
          SHA256=$(sha256sum "$PACKAGE" | cut -d' ' -f1)
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE"
          echo "SHA256: $SHA256"

      - name: Update SHA256 on main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA256="${{ steps.build.outputs.sha256 }}"
          git stash --include-untracked
          git checkout main
          sed -i "s/ENTITY sha256    \"PENDING\"/ENTITY sha256    \"${SHA256}\"/" claude-code.plg
          git add claude-code.plg
          git commit -m "Update SHA256 for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.package }}
          generate_release_notes: true
